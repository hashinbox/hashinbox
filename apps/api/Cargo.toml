[package]
name = "payment-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The payment HTTP routes and OpenAPI contract over the chain-neutral wallet and index abstractions."
readme = "README.md"

[dependencies]
axum = "0.8"
base = { path = "../../sdk/base" }
base64 = "=0.22.1"
http-server = { path = "../../packages/http-server" }
hex.workspace = true
indexing = { path = "../../sdk/indexing", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["sync"] }
utoipa = { version = "=5.5.0", features = ["axum_extras"] }
utoipa-axum = "=0.2.0"
uuid.workspace = true
wallets = { path = "../../sdk/wallets" }
zeroize.workspace = true

[dev-dependencies]
http-body-util = "=0.1.4"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower = { version = "=0.5.2", features = ["util"] }

[lints]
workspace = true
