[package]
name = "hashinbox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The hashinbox binary: the workspace's single composition root of chains, storage, and the HTTP API."
autotests = false

[[bin]]
name = "hashinbox"
path = "src/main.rs"

[features]
solana-node = []

[dependencies]
anyhow.workspace = true
# Session JWTs (`models::session`); passwords, TOTP and mnemonics are `crypto`'s.
jsonwebtoken.workspace = true
# The scopes a user, key or session holds, and each endpoint's check.
scope = { path = "../../packages/scope" }
clap = { workspace = true, features = ["env"] }
axum = "0.8"
base = { path = "../../sdk/base" }
crypto = { path = "../../packages/crypto" }
chain-bitcoin = { path = "../../sdk/chains/bitcoin" }
chain-ethereum = { path = "../../sdk/chains/ethereum" }
chain-solana = { path = "../../sdk/chains/solana" }
# The stream of `GET .../tip/search` (axum's SSE takes a `Stream`); the market feeds asked at once (`join_all`).
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
hex.workspace = true
# The market feeds' public HTTP APIs (`usecase::market`).
reqwest.workspace = true
# Parses the RFC 3339 time `GET .../tip?at=` finds a block by.
jiff = { version = "=0.2.35", default-features = false, features = ["std"] }
http-server = { path = "../../packages/http-server" }
rpc = { path = "../../packages/rpc" }
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
# Names the field a `--config` preset fails at (`usecase::bootstrap`).
serde_path_to_error = "=0.1.20"
# The one SQLite file: every table's model (`src/models`) and the SDK storage
# traits implemented on them (`src/usecase/sdk`).
diesel.workspace = true
libsqlite3-sys.workspace = true
# The job queue contract and runner; its SQLite store is `src/usecase/tasks.rs`.
tasks = { path = "../../packages/tasks", features = ["runner"] }
tokio = { workspace = true, features = ["fs", "net", "process", "rt", "signal", "sync", "time"] }
# The trigger engine: its language's building blocks, the round, the stats
# the API shows (`openapi`); the server adds storage and its actions.
trigger = { path = "../../sdk/trigger", features = ["openapi"] }
# Events and spans; the one subscriber (stdout, the `log` table).
tracing.workspace = true
tracing-subscriber.workspace = true
# One UUIDv7 per trigger batch: its group id.
uuid.workspace = true
utoipa = { version = "=5.5.0", features = ["axum_extras"] }
utoipa-axum = "=0.2.0"
url = "=2.5.8"
zeroize.workspace = true

[dev-dependencies]
# The mock chains and nodes the suite (`tests/support`, `tests/cases`) runs over.
base = { path = "../../sdk/base", features = ["testing"] }
chain-ethereum = { path = "../../sdk/chains/ethereum", features = ["testing"] }
alloy-consensus.workspace = true
alloy-eips.workspace = true
alloy-primitives.workspace = true
bitcoin.workspace = true
futures-executor.workspace = true
http-body-util = "=0.1.4"
# The scripted node behind a test network's client.
rpc = { path = "../../packages/rpc", features = ["testing"] }
# The store contract the SQLite queue runs.
tasks = { path = "../../packages/tasks", features = ["runner", "testing"] }
tempfile = "=3.27.0"
# A fixed-price fee estimator for `send` over the SQLite store (`tests/pipe.rs`).
trigger = { path = "../../sdk/trigger", features = ["openapi", "testing"] }
tower = { version = "=0.5.2", features = ["util"] }
# Hand-built JWTs the server must refuse (`alg: none`, `EdDSA`).
base64 = "=0.22.1"

[lints]
workspace = true
