[package]
name = "tasks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
readme = "README.md"
description = "Owned Tokio tasks and the durable job queue contract with its runner."

[features]
# The Tokio runner (`tasks::Runner`) and `Handle::wait`.
runner = ["dep:logging", "tokio/time", "tokio/macros"]

[dependencies]
tokio = { version = "=1.49.0", default-features = false, features = ["rt", "sync"] }
uuid.workspace = true
serde_json.workspace = true
logging = { path = "../logging", optional = true }

[lints]
workspace = true
