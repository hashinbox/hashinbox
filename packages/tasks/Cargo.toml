[package]
name = "tasks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
readme = "README.md"
description = "Owned Tokio tasks and durable job queue primitives."

[features]
# `Worker`, `Task` and `Ticking`.
runner = ["tokio/time", "tokio/macros"]

[dependencies]
tokio = { version = "=1.49.0", default-features = false, features = ["rt", "sync"] }
uuid.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[lints]
workspace = true
