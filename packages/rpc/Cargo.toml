[package]
name = "rpc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Bounded JSON-RPC over HTTP: one URL per node, retry and failover as decorators."
readme = "README.md"

[features]
default = []
# The node doubles (`rpc::testing`: `Script`, `Faults`). Off, the crate carries no
# test scaffolding; it belongs in a `[dev-dependencies]` entry only.
testing = []

[dependencies]
logging = { path = "../logging" }
jsonrpsee.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["raw_value"] }
tokio = { workspace = true, features = ["time"] }
url = "2"

[dev-dependencies]
futures-executor.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "rt"] }
# This package on itself: the only way Cargo offers to turn one of a crate's
# own features on for its own integration tests.
rpc = { path = ".", features = ["testing"] }

[lints]
workspace = true
