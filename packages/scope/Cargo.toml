[package]
name = "scope"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Access scopes as text (`com.hashinbox.wallets[id]:read`): parsing, subtree coverage, narrowing checks, compression, dependency expansion, a declared schema, and macros to deny requests."

[dependencies]
scope-macros = { path = "macro" }
serde = { workspace = true, features = ["derive", "std"] }
utoipa = { workspace = true, optional = true }

[features]
# `Group`'s OpenAPI schema (`ScopeGroup`).
utoipa = ["dep:utoipa"]

[dev-dependencies]
futures-executor.workspace = true
serde_json.workspace = true
utoipa.workspace = true

[lints]
workspace = true
