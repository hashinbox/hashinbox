[workspace]
members = [
    "apps/server",
    "sdk/base",
    "sdk/chains/bitcoin",
    "sdk/chains/ethereum",
    "sdk/chains/solana",
    "sdk/trigger",
    "packages/decimal",
    "packages/crypto",
    "packages/rpc",
    "packages/http-server",
    "packages/tasks",
    "packages/scope",
    "packages/scope/macro",
]
exclude = ["old", "reference"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"

[workspace.dependencies]
clap = { version = "4.6", features = ["derive"] }
anyhow = "1"
alloy-primitives = { version = "1", default-features = false, features = ["std"] }
alloy-consensus = { version = "1.8", features = ["k256"] }
alloy-eips = "1.8"
alloy-sol-types = "1"
bigdecimal = "=0.4.10"
bitcoin = { version = "=0.32.102", default-features = false, features = ["std"] }
futures-executor = "0.3"
futures-channel = "0.3"
hex = "=0.4.3"
k256 = { version = "=0.13.4", features = ["ecdsa", "schnorr"] }
num-bigint = "=0.4.6"
num-traits = "=0.2.19"
# `scope-macros`: the `#[scope::utoipa]` proc macro.
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "2.0.119", default-features = false, features = ["parsing", "printing", "proc-macro"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls"] }
jsonrpsee = { version = "=0.24.10", default-features = false, features = ["http-client"] }
serde = { version = "1", default-features = false }
serde_json = "1"
utoipa = "=5.5.0"
sha2 = "=0.10.9"
# The server's SQL store: diesel on SQLite (sync; run on `spawn_blocking`),
# pooled with r2d2. 2.3 needs Rust 1.86, within the MSRV.
diesel = { version = "=2.3.14", default-features = false, features = ["sqlite", "r2d2", "returning_clauses_for_sqlite_3_35", "32-column-tables"] }
# Diesel links SQLite through this; bundled, so no system library is needed.
libsqlite3-sys = { version = "0.30", features = ["bundled"] }
# Libraries emit events and spans; only the server installs a subscriber.
tracing = { version = "0.1.41", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.20", default-features = false, features = ["std", "registry", "env-filter", "fmt"] }
tokio = { version = "=1.49.0", features = ["macros", "rt-multi-thread"] }
uuid = { version = "=1.18.1", features = ["v7"] }
zeroize = "=1.8.2"
# The server's sessions as HS256 JWTs; `packages/crypto`'s argon2id password
# hashes, TOTP codes from HMAC-SHA1 and the key secret's CRC32.
jsonwebtoken = { version = "=9.3.1", default-features = false }
argon2 = { version = "=0.5.3", default-features = false, features = ["alloc", "password-hash"] }
bitcoin_hashes = "=0.14.101"
crc = "=3.4.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
missing_crate_level_docs = "deny"
invalid_codeblock_attributes = "deny"
bare_urls = "warn"

[workspace.lints.clippy]
all = "warn"

# Build speed. Line tables keep backtraces readable at a fraction of full debug
# info; dependencies are optimized once (they rarely rebuild) so tests that hash,
# sign or run SQLite are not slowed by unoptimized third-party code.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1
debug = false
