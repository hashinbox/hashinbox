# Development configuration: test and main networks, no keys, loopback only.
# `display_decimals` (a network's, for its native currency, and a token's):
# fractional digits views and logs show; amounts stay exact.
#   cargo run -p payment-server -- migrate config.toml   (once, new database)
#   cargo run -p payment-server -- serve config.toml
# The UI dev server (apps/server/ui, `npm run dev`) proxies to this `bind`.
bind = '127.0.0.1:8080'
storage = { path = '.data/payment.db' }  # .data/ is git-ignored

[ui]
brand = 'payments · dev'

# Explorer links per network: `{address}` and `{tx}` are filled in.
[ui.explorers.ethereum.sepolia]
address = 'https://sepolia.etherscan.io/address/{address}'
transaction = 'https://sepolia.etherscan.io/tx/{tx}'

[ui.explorers.ethereum.mainnet]
address = 'https://etherscan.io/address/{address}'
transaction = 'https://etherscan.io/tx/{tx}'

[ui.explorers.solana.devnet]
address = 'https://explorer.solana.com/address/{address}?cluster=devnet'
transaction = 'https://explorer.solana.com/tx/{tx}?cluster=devnet'

[ui.explorers.solana.mainnet]
address = 'https://explorer.solana.com/address/{address}'
transaction = 'https://explorer.solana.com/tx/{tx}'

[[payments.networks]]
chain = 'ethereum'
network = 'sepolia'
chain_id = 11155111
display_decimals = 6
endpoints = ['https://ethereum-sepolia-rpc.publicnode.com']
# Circle's test USDC.
tokens = [{ contract = '0x1c7d4b196cb0c7b01d743fbc6116a902379c7238', decimals = 6, ticker = 'USDC', display_decimals = 2 }]

[[payments.networks]]
