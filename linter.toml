# Payment-SDK policy for the Linter MCP server.
# Derived from linter://configs/rust.toml; preserves the preset's semantic checks and limits.
# Requirements and ownership: AGENTS.md and the owning README.
# Findings are a review baseline; source is not grandfathered by its current shape.

[files]
# Excluded research and non-source output; all first-party workspace crates remain checked.
exclude = ["**/.git", "**/target", "**/vendor", "**/generated", "**/node_modules", "old", "reference"]

[[rules.layout]]
target = "."
mode = "permissive"

files.required = ["Cargo.toml", "Cargo.lock", "linter.toml", "AGENTS.md"]

[[rules.layout]]
target = ["**/*.md", "**/*.markdown"]
allow = false
case_sensitive = false

[[rules.layout]]
target = ["docs/*.md", "docs/adr/*.md", "docs/reviews/*.md"]
allow = true
description = "Canonical requirements, design decisions, implementation evidence, and source reviews."

[[rules.layout]]
target = "docs/design/*.md"
allow = true
description = "Recorded architecture failures and their accepted fix plans."

[[rules.layout]]
target = ["AGENTS.md", "README.md"]
allow = true
description = "Repository entry points for agent guidance, architecture, and usage."

[[rules.layout]]
target = "{apps,sdk,packages}/**/README.md"
allow = true
description = "Crate usage documentation beside the owning package."

[[rules.layout]]
target = "examples/README.md"
allow = true
description = "Index of runnable SDK examples and the local node each one needs."

[[rules.layout]]
target = "tests/kurtosis/*/README.md"
allow = true
description = "Runbooks for owned local chain fixtures."

[[rules.layout]]
target = [
    "**/{test,tests}.rs",
    "**/*{_,.,-}{test,tests}.rs",
    "**/{test,tests}{_,.,-}*.rs",
    "**/{test,tests}/**/*.rs",
]
allow = false
case_sensitive = false

[[rules.layout]]
target = ["**/*{Test,Tests}.rs"]
allow = false

[[rules.layout]]
target = ["tests/**/*.rs", "examples/tests/*.rs", "apps/*/tests/**/*.rs", "packages/*/tests/**/*.rs", "packages/*/*/tests/**/*.rs", "sdk/*/tests/**/*.rs", "sdk/*/*/tests/**/*.rs"]
allow = true
description = "Crate integration tests and repository-wide test cases."

[[rules."rust/file-length"]]
target = "**/*.rs"
max_lines = 1000

[[rules.filename]]
target = "**/src/**/*.rs"
kind = "file"
case = "snake_case"
max_words = 2
reject_numbered_fragments = true

[[rules.filename]]
target = ["apps/*/src/**", "packages/*/src/**", "sdk/**/src/**"]
kind = "directory"
case = "snake_case"
max_words = 1

# The browser app's folders are single words too, but a leading underscore is
# allowed: `_components` sorts above the pages in every file tree.
[[rules.filename]]
target = "apps/server/ui/src/**"
kind = "directory"
max_words = 1

[[rules."forbidden-words"]]
target = "**/src/**"
words = ["common", "core", "helper", "helpers", "misc", "shared", "util", "utils"]

[[rules."redundant-parent-name"]]
target = "**/src/**/*.{rs,c,h}"
ignored_names = ["mod", "lib", "main", "index"]

[[rules."line-width"]]
target = "**/*.{rs,c,h}"
max_columns = 100
tab_width = 4

[[rules."rust/max-indent"]]
target = "**/*.rs"
max_columns = 20
tab_width = 4

[[rules."rust/function-length"]]
target = "**/*.rs"
max_lines = 400

[[rules."rust/method-length"]]
target = "**/*.rs"
max_lines = 400

[[rules."rust/nesting"]]
target = "**/*.rs"
max_depth = 2
ignore_guard_clauses = true

[[rules."rust/struct-noun-naming"]]
target = "**/*.rs"
# Bitcoin's vocabulary (a retired design note (007)): a `Spend` is one input of an unsigned transaction.
accepted_words = ["spend"]

[[rules."rust/duplicate-entity-base"]]
target = "**/*.rs"
min_shared_fields = 3

[[rules."rust/wire-domain-model-duplication"]]
target = "**/*.rs"
min_shared_fields = 3
min_overlap_percent = 75

[[rules."rust/boolean-state-cluster"]]
target = "**/*.rs"
min_fields = 3

[[rules."rust/string-backed-finite-state"]]
target = "**/*.rs"
min_variants = 3

[[rules."rust/trait-method-count"]]
target = "**/*.rs"
max_methods = 3

[[rules."rust/struct-word-count"]]
target = "**/*.rs"
max_words = 2

[[rules."rust/empty-struct"]]
target = "**/*.rs"

[[rules."rust/module-name"]]
target = "**/*.rs"
forbidden_words = ["common", "core", "helper", "helpers", "misc", "shared", "util", "utils"]

[[rules."markdown/examples"]]
target = "**/*.md"
min_cases = 0

# Crate READMEs are the crate's rustdoc (`#![doc = include_str!("../README.md")]`) and stay
# short: two sentences on what the crate is for, then a usage section. A notes section is
# optional and holds only what is hard to discover and costly to get wrong.
[[rules."markdown/examples"]]
target = "{apps,sdk,packages}/**/README.md"
min_cases = 1

[[rules."rust/path-module-flattening"]]
target = "**/*.rs"
max_child_domains = 1

[[rules."rust/receiver-name-repetition"]]
target = "**/*.rs"

[[rules."rust/self-constructor-static"]]
target = "**/*.rs"

[[rules."rust/redundant-module-prefix"]]
target = "**/*.rs"

[[rules."rust/god-object-growth"]]
target = "**/*.rs"
excluded_suffixes = ["Builder"]

[[rules."rust/detached-constructor"]]
target = "**/*.rs"

[[rules."rust/redundant-accessor"]]
target = "**/*.rs"

[[rules."rust/unsafe-boundary"]]
target = "**/*.rs"

[[rules."rust/free-function"]]
target = "**/*.rs"
mode = "receiver"
boundary_derives = ["clap::Parser", "clap::Args", "Parser", "Args"]

[[rules."rust/redundant-namespace"]]
target = "**/*.rs"

[[rules."rust/single-use-free-function"]]
target = "**/*.rs"

[[rules."rust/provisional-diagnostic"]]
target = "**/*.rs"
terms = ["temporary", "diagnostic"]

[[rules."rust/dependency-cycles"]]
target = "**"

[[rules."rust/redundant-marker"]]
target = "**/*.rs"

[[rules."rust/async-blocking-operation"]]
target = "**/*.rs"
scope = "production"

# Library, application, and protocol structure are separate from naming rules.
[[rules.layout]]
# Every crate carries its README: the crate-level rustdoc (a retired design note (005)).
target = ["packages/*", "sdk/chains/*", "sdk/{base,config,indexing,wallets}"]
mode = "permissive"
files.required = ["Cargo.toml", "README.md", "src/lib.rs"]

# One application crate: the binary that reads its configuration and serves the
# HTTP API. The routes are its `api` module, not a library beside it.
[[rules.layout]]
target = "apps/server"
mode = "permissive"
files.required = ["Cargo.toml", "README.md", "src/main.rs", "src/chains.rs", "src/api/mod.rs"]

# The server's browser app (React, built by Vite, embedded by src/ui.rs).
# Generic components carry no domain and sit in src/_components; a page is one
# file in src/pages, and becomes a folder only when it has components of its
# own, holding page.tsx beside them. The client in src/api is generated from
# docs/openapi.json. dist/ is the committed build the binary embeds.
[[rules.layout]]
target = "apps/server/ui/src"
mode = "restrictive"
files.required = ["main.tsx", "root.tsx", "layout.tsx", "theme.ts", "api/client.ts", "api/schema.d.ts"]
files.allowed = [
    { target = "*.ts", description = "Browser-side vocabulary shared by pages: exact amounts, the theme." },
    { target = "providers.json", description = "RPC provider URL and authentication templates used by the provider import form." },
]
directories.allowed = [
    { target = "_components", description = "Generic components with no domain knowledge." },
    { target = "pages", description = "One file per page, or a folder for a page with its own components." },
]

[[rules.layout]]
target = "apps/server/ui/src/pages/*"
mode = "restrictive"
files.required = ["page.tsx"]
directories.allowed = [
    { target = "_components", description = "Components only this page uses." },
]

[[rules.filename]]
target = "apps/server/ui/src/**/*.tsx"
kind = "file"
case = "snake_case"
max_words = 1

# An application is a distributable binary; it exports nothing.
[[rules.layout]]
target = "apps/*/src/lib.rs"
allow = false

# sdk/ holds chain-neutral capability crates plus the chains/ category; nothing else.
[[rules.layout]]
target = "sdk"
mode = "restrictive"
directories.allowed = [
    { target = "base", description = "Chain-neutral values and capability traits." },
    { target = "payments", description = "The Payments container and its configuration module." },
    { target = "indexing", description = "Chain-neutral indexing contracts and adapters." },
    { target = "wallets", description = "Chain-neutral wallet contracts." },
    { target = "chains", description = "Concrete chain implementations only." },
]

# sdk/chains/ contains only chain crates; no loose files, no shared or test-support crates.
[[rules.layout]]
target = "sdk/chains"
mode = "restrictive"
directories.allowed = [{ target = "*", description = "One concrete chain implementation." }]

# Chain crate root: closed world. No examples/,
# benches/, build.rs, or loose files; a new chain fails until it has the
# full skeleton.
[[rules.layout]]
target = "sdk/chains/*"
mode = "restrictive"
files.required = [
    "Cargo.toml",
    "README.md",
    "src/lib.rs",
]

# Canonical chain src/: one adapter file per SDK contract; native/ holds all
# protocol code and is open (scripts/check-chains.sh guards its imports).
[[rules.layout]]
target = "sdk/chains/*/src"
mode = "restrictive"
files.required = [
    "lib.rs",
    "config.rs",
    "error.rs",
    "identity.rs",
    "source.rs",
    "interpreter.rs",
    "indexer.rs",
    "key.rs",
    "wallet.rs",
    "builder.rs",
    "sender.rs",
    # The send pipeline:
    # the same stages in the same files on every chain.
    "sender/outbox.rs",
    "sender/reservation.rs",
    "sender/dispatch.rs",
    "sender/recovery.rs",
    "native/mod.rs",
    "native/error.rs",
    "native/rpc/submitter.rs",
    "native/transaction/preflight.rs",
    "native/transaction/funds.rs",
]
directories.allowed = [
    { target = "{source,interpreter,wallet,sender}", description = "Submodules of the same-named adapter file when it outgrows one file." },
]

# Runnable examples (a retired design note (004)): one directory per scenario, not per
# chain. A scenario directory is its `main.rs` and the `config.toml` beside it
# that states the chains it runs, so the src-tree rule below does not reach
# them. `custom_store` is the one scenario with a third file: the repository it
# supplies is the subject of the scenario rather than its setup, and
# examples/tests/custom_store.rs includes that same file so the store the
# scenario runs is the store the test asserts against. Every scenario is
# self-contained: there is no shared library under examples/, and each main.rs
# registers the chains it links, because which chains an application links is
# its own decision.
# scripts/check-chains.sh check 4 requires a section per chain in every
# scenario's config.toml, and examples/tests/scenarios.rs requires that each
# main.rs registers exactly the chains its config.toml configures.
[[rules.layout]]
target = "examples"
mode = "restrictive"
files.required = [
    "Cargo.toml",
    "README.md",
    "wallet/main.rs",
    "wallet/config.toml",
    "transfer/main.rs",
    "transfer/config.toml",
    "indexing/main.rs",
    "indexing/config.toml",
    "watch_only/main.rs",
    "watch_only/config.toml",
    "all_chains/main.rs",
    "all_chains/config.toml",
    "custom_store/main.rs",
    "custom_store/config.toml",
    "custom_store/sink.rs",
]
directories.allowed = [
    { target = "{wallet,transfer,indexing,watch_only,all_chains}", description = "One runnable scenario: its main.rs and the config.toml that states its chains." },
    { target = "custom_store", description = "The scenario that supplies its own indexing repository: main.rs, its config.toml and the store it writes." },
    { target = "tests", description = "The examples' scenario tests." },
]

[[rules.layout]]
target = ["apps/api", "apps/indexer", "apps/wallet", "sdk/deposits", "sdk/indexing/http"]
allow = false

# Empty source files/directories and one-file child modules do not define a domain.
[[rules.layout]]
target = "{apps,sdk,packages}/**/src/**"
files.allow_empty = false
directories.allow_empty = false
directories.allow_single_file = false

# sdk/indexing/src/storage (ARCHITECTURE.md, "Dependency direction"): a file
# directly in it is shared by every store, and a directory directly in it is one
# store. A folder that groups shared code is not a store and fails here until it
# is flattened into files; a new store is named here and in the ban below.
# Who may import a store is not a path rule, so scripts/check-chains.sh check 12
# holds that.
[[rules.layout]]
target = "sdk/indexing/src/storage"
mode = "restrictive"
files.allowed = [
    { target = "*.rs", description = "The ports, and what every store is asked and answers with." },
]
directories.allowed = [
    { target = "sqlite", description = "One store: every port on one embedded SQL file." },
    { target = "memory", description = "One store: every port on ordinary maps in this process." },
]

# A store's root module is inside its folder (`sqlite/mod.rs`), never beside it
# (`sqlite.rs`): a file directly in storage/ is shared, and a store's root is not.
[[rules.layout]]
target = "sdk/indexing/src/storage/*"
mode = "permissive"
files.required = ["mod.rs"]

[[rules.layout]]
target = "sdk/indexing/src/storage/{sqlite,memory}.rs"
allow = false

[[rules."shared-affix"]]
target = "**/src/**/*.rs"
max_prefix = 2
max_suffix = 2

# Cargo layers also cover build, dev, optional, and target-specific local dependencies.
# Package discovery, unlike structural layout, selects only actual Cargo packages.
[[rules."rust/layers"]]
name = "packages"
target = "packages/**"
dependencies = ["packages"]

[[rules."rust/layers"]]
name = "base"
target = "sdk/base"
dependencies = ["packages"]

# The self-edge is `indexing`'s dev-dependency on itself, which is how Cargo
# enables a crate's own feature for its own integration tests (`memory`, the
# store the shared contracts are held against beside `sqlite`). It couples no
# package to another, and the layer covers exactly one package, so it permits no
# cross-package edge that was forbidden before.
[[rules."rust/layers"]]
name = "indexing"
target = "sdk/indexing"
dependencies = ["packages", "base", "indexing"]

[[rules."rust/layers"]]
name = "wallets"
target = "sdk/wallets"
dependencies = ["packages", "base"]

# Every package under sdk/chains is a concrete chain; omitting "chains" forbids peer edges.
# `payments` (the container and its configuration reader) sits above `wallets` and `indexing` because it
# composes a registered chain's factories and index (`payments::config::Composition`), and below `chains` because it names no
# chain crate; registration keeps concrete dependencies at composition.
[[rules."rust/layers"]]
name = "payments"
target = "sdk/payments"
dependencies = ["packages", "base", "indexing", "wallets"]

[[rules."rust/layers"]]
name = "chains"
target = "sdk/chains/*"
dependencies = ["packages", "base", "indexing", "wallets", "payments"]

# The composition root may name every chain; only it may. Its routes and wire
# models (`apps/server/src/api`) see the abstractions only, which a layer cannot
# say because layers are Cargo packages: scripts/check-chains.sh check 8 holds
# that boundary inside the crate.
[[rules."rust/layers"]]
name = "server"
target = "apps/server"
dependencies = [
    "packages",
    "base",
    "indexing",
    "wallets",
    "payments",
    "chains",
]

# Runnable SDK examples compose like an application; nothing depends on them.
[[rules."rust/layers"]]
name = "examples"
target = "examples"
dependencies = ["packages", "base", "indexing", "wallets", "payments", "chains"]

# Read ambient configuration at application configuration or owned benchmark entry points.
[[rules."rust/environment-variable-access"]]
target = "**/*.rs"
scope = "production"
allowed_targets = [
    "apps/server/src/config.rs",
    "sdk/indexing/examples/bench.rs",
]
functions = [
    "std::env::var",
    "std::env::var_os",
    "std::env::vars",
    "std::env::vars_os",
    "std::env::set_var",
    "std::env::remove_var",
    "std::env::current_dir",
    "std::env::current_exe",
    "std::env::temp_dir",
]
macros = ["env", "option_env", "std::env", "std::option_env"]
