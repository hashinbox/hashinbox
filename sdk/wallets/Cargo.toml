[package]
name = "wallets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Chain-neutral wallet contracts and the Wallets registry: factories, wallet capabilities, and batch sends."
readme = "README.md"

[features]
# The default registrar: `wallets::Submissions`, which spawns the send work a
# chain hands over and drains it. Off, the crate carries no async runtime, which
# is what the chain crates and `sdk/config` link.
submissions = ["dep:tokio", "tokio/rt"]

[dependencies]
base = { path = "../base" }
crypto = { path = "../../packages/crypto" }
indexing = { path = "../indexing", default-features = false }
tokio = { version = "=1.49.0", default-features = false, optional = true }

[dev-dependencies]
futures-executor.workspace = true
# The in-memory store (`indexing::memory`), which stands in for an opened
# database while a composition is assembled. A shipped backend, so this names
# `memory` alone and carries none of the repository contract scenarios.
indexing = { path = "../indexing", default-features = false, features = ["memory"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
