[package]
name = "chain-ethereum"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Ethereum for hashinbox: a block-by-block chain, ETH and ERC-20 wallets, and a broadcaster."
readme = "README.md"

[features]
default = []
# The mock Sepolia (`chain_ethereum::testing`): its model, recordings and
# `TestChain`. Dev-dependencies only.
testing = ["base/testing", "rpc/testing"]

[dependencies]
anyhow.workspace = true
base = { path = "../../base" }
crypto = { path = "../../../packages/crypto" }
alloy-consensus.workspace = true
alloy-eips.workspace = true
alloy-primitives = { workspace = true, features = ["serde"] }
alloy-sol-types.workspace = true
alloy-rpc-types-eth = { version = "1.8", default-features = false, features = ["serde", "std"] }
num-bigint.workspace = true
rpc = { path = "../../../packages/rpc" }
serde_json = { workspace = true, features = ["raw_value"] }
serde = { workspace = true, features = ["derive"] }

[dev-dependencies]
futures-executor.workspace = true
# The scripted node double (`rpc::testing`): tests only, never a production link.
rpc = { path = "../../../packages/rpc", features = ["testing"] }
# This crate on itself: turns `testing` on for its own tests.
chain-ethereum = { path = ".", features = ["testing"] }
# The record step's runtime (`RECORD=1`, by hand).
tokio = { workspace = true }

[lints]
workspace = true
