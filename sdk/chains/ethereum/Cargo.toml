[package]
name = "chain-ethereum"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Ethereum for the payment SDK: a block-by-block chain, ETH and ERC-20 wallets, and a broadcaster."
readme = "README.md"

[dependencies]
anyhow.workspace = true
base = { path = "../../base" }
crypto = { path = "../../../packages/crypto" }
alloy-consensus.workspace = true
alloy-eips.workspace = true
alloy-primitives = { workspace = true, features = ["serde"] }
alloy-sol-types.workspace = true
alloy-rpc-types-eth = { version = "1.8", default-features = false, features = ["serde", "std"] }
num-bigint.workspace = true
json-rpc = { path = "../../../packages/json-rpc" }
serde_json = { workspace = true, features = ["raw_value"] }
serde = { workspace = true, features = ["derive"] }

[dev-dependencies]
futures-executor.workspace = true
# The scripted node double (`json_rpc::testing`): tests only, never a production link.
json-rpc = { path = "../../../packages/json-rpc", features = ["testing"] }

[lints]
workspace = true
