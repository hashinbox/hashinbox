[package]
name = "chain-bitcoin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Bitcoin for the payment SDK: blocks as base legs, UTXO wallets, building, signing and broadcast."
readme = "README.md"

[features]
default = []
# The test fixtures (`chain_bitcoin::testing`). Dev-dependencies only.
testing = ["base/testing", "rpc/testing"]

[dependencies]
anyhow.workspace = true
base = { path = "../../base" }
crypto = { path = "../../../packages/crypto" }
bitcoin.workspace = true
rpc = { path = "../../../packages/rpc" }
serde_json = { workspace = true, features = ["arbitrary_precision"] }
serde = { workspace = true, features = ["derive"] }

[dev-dependencies]
# This crate on itself: turns `testing` on for its own tests.
chain-bitcoin = { path = ".", features = ["testing"] }
# The scripted node double (`rpc::testing`): tests only, never a production link.
rpc = { path = "../../../packages/rpc", features = ["testing"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
