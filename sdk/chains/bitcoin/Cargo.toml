[package]
name = "chain-bitcoin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Bitcoin for the payment SDK: blocks as base legs, UTXO wallets, building, signing and broadcast."
readme = "README.md"

[dependencies]
anyhow.workspace = true
base = { path = "../../base" }
crypto = { path = "../../../packages/crypto" }
bitcoin.workspace = true
json-rpc = { path = "../../../packages/json-rpc" }
serde_json = { workspace = true, features = ["arbitrary_precision"] }
serde = { workspace = true, features = ["derive"] }

[dev-dependencies]
# The scripted node double (`json_rpc::testing`): tests only, never a production link.
json-rpc = { path = "../../../packages/json-rpc", features = ["testing"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
