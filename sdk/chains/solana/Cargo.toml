[package]
name = "chain-solana"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Solana for hashinbox: blocks as base legs, Ed25519 wallets, SOL and SPL transfers, broadcast."
readme = "README.md"

[features]
default = []
# The test fixtures (`chain_solana::testing`). Dev-dependencies only.
testing = ["base/testing", "rpc/testing"]

[dependencies]
anyhow.workspace = true
base = { path = "../../base" }
crypto = { path = "../../../packages/crypto" }
rpc = { path = "../../../packages/rpc" }
base64 = "=0.22.1"
bincode = "=1.3.3"
bs58 = "=0.5.1"
getrandom = "=0.3.4"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
solana-address = { version = "=2.2.0", features = ["std", "decode", "curve25519"] }
solana-hash = { version = "=4.1.0", features = ["decode"] }
solana-instruction = "=3.0.0"
solana-message = { version = "=3.1.0", features = ["bincode"] }
solana-signature = { version = "=3.3.0", features = ["verify"] }
solana-system-interface = { version = "=3.0.0", features = ["bincode"] }
solana-transaction = { version = "=3.1.0", features = ["bincode", "verify"] }
spl-memo-interface = "=2.0.0"

[dev-dependencies]
# This crate on itself: turns `testing` on for its own tests.
chain-solana = { path = ".", features = ["testing"] }
futures-executor.workspace = true
# The reference Ed25519 implementation Solana itself ships: tests assert that
# `crypto::Ed25519` signs the same bytes. Production signing never links it.
solana-keypair = "=3.1.2"
# The scripted node double (`rpc::testing`): tests only.
rpc = { path = "../../../packages/rpc", features = ["testing"] }

[lints]
workspace = true
