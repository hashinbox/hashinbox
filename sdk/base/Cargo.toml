[package]
name = "base"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Chain-neutral values and capabilities: canonical addresses, networks, assets, amounts, blocks, and broadcast."

[features]
default = []
# The chain-neutral mock chain and nodes (`base::testing`). Off by default;
# dev-dependencies only, no production code names it.
testing = ["rpc/testing"]

[dependencies]
anyhow.workspace = true
crypto = { path = "../../packages/crypto" }
decimal = { path = "../../packages/decimal" }
tracing.workspace = true
rpc = { path = "../../packages/rpc" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }

[dev-dependencies]
# This crate on itself: turns `testing` on for its own tests.
base = { path = ".", features = ["testing"] }
futures-executor.workspace = true

[lints]
workspace = true
