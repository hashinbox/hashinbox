[package]
name = "indexing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Reorg-safe, chain-neutral block synchronization into canonical history, checkpoints, and live outputs."
readme = "README.md"

[features]
# `sqlite` is the file store this crate ships, and the one a build gets without
# asking. It stays a feature rather than becoming
# unconditional because that is what lets `payments::config` and the chain
# crates depend on this crate with `default-features = false` and get no store
# and no async runtime through it.
default = ["sqlite", "driver"]
# The embedded SQL store: `indexing::sqlite`, on `sqlx` (bundled SQLite, its
# pool, and one worker thread per connection). It brings Tokio with it: sqlx
# runs on the Tokio runtime, so a build with this store has one whether or not
# it takes `driver`. Off, the crate is the traits and the vocabulary.
sqlite = ["dep:sqlx"]
# The driver: `indexing::Driver` and its tasks. Off, the crate carries no
# async runtime.
driver = ["dep:tokio", "tokio/macros", "tokio/rt", "tokio/sync", "tokio/time"]
# The in-process store: `indexing::memory`, on no file and no runtime. A second
# shipped backend rather than a test double — it answers every port `sqlite`
# does, including the consumer capabilities — for an ephemeral process, an
# embedding that wants nothing on disk, and any test that would otherwise open
# one. Independent of `sqlite`: a build may take either, both, or neither.
memory = []
# The scripted chain double (`indexing::testing`). Off, the crate carries no
# test scaffolding; it belongs in a `[dev-dependencies]` entry only.
testing = []

[dependencies]
logging = { path = "../../packages/logging" }
base = { path = "../base" }
# `SecretBytes`: the zeroizing key a wallet row may hold (`WalletRegistry`).
crypto = { path = "../../packages/crypto" }
futures-channel.workspace = true
num-bigint.workspace = true
sqlx = { workspace = true, optional = true }
tokio = { version = "=1.49.0", default-features = false, optional = true }

[dev-dependencies]
# This package on itself: the only way Cargo offers to turn one of a crate's
# own features on for its own integration tests, and the reason `rust/layers`
# names `indexing` in its own dependency list. Cargo permits a dev-dependency
# cycle for exactly this case.
indexing = { path = ".", features = ["memory", "testing"] }
futures-executor.workspace = true
tempfile = "=3.27.0"
tokio = { version = "=1.49.0", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
