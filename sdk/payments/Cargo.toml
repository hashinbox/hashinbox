[package]
name = "payments"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The payments container: configured networks composed over the application's stores into indexers, wallet factories and assets."
readme = "README.md"

[dependencies]
anyhow.workspace = true
base = { path = "../base" }
crypto = { path = "../../packages/crypto" }
json-rpc = { path = "../../packages/json-rpc" }
serde = { workspace = true, features = ["derive", "std"] }
serde_json.workspace = true
toml = { version = "=0.9.12", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }

[features]
default = []
# Reading the configuration document from TOML text.
toml = ["dep:toml"]

[lints]
workspace = true
