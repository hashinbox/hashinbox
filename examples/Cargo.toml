[package]
name = "payment-examples"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Runnable scenarios: one directory per scenario, every chain inside it as setup."
readme = "README.md"
publish = false

# `local.rs` is the examples' non-chain setup, shared by every scenario as the
# `local` library: the deployment document each one configures its chains
# from, the index file, and the node transport. A scenario directory is one
# `[[example]]` — its `main.rs` — beside the `config.toml` that states its
# chains.
[lib]
name = "local"
path = "local.rs"

[dependencies]
base = { path = "../sdk/base" }
chain-bitcoin = { path = "../sdk/chains/bitcoin" }
chain-ethereum = { path = "../sdk/chains/ethereum" }
chain-solana = { path = "../sdk/chains/solana" }
sdk-config = { path = "../sdk/config", features = ["toml"] }
wallets = { path = "../sdk/wallets" }
indexing = { path = "../sdk/indexing" }
json-rpc = { path = "../packages/json-rpc" }
serde = { workspace = true, features = ["derive", "std"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["fs", "sync", "time"] }

[[example]]
name = "wallet"
path = "wallet/main.rs"

[[example]]
name = "transfer"
path = "transfer/main.rs"

[[example]]
name = "indexing"
path = "indexing/main.rs"

[[example]]
name = "watch_only"
path = "watch_only/main.rs"

[[example]]
name = "all_chains"
path = "all_chains/main.rs"

[[example]]
name = "custom_store"
path = "custom_store/main.rs"

[lints]
workspace = true
