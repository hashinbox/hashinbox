[package]
name = "payment-examples"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Runnable scenarios: one directory per scenario, every chain inside it as setup."
readme = "README.md"
publish = false

# A scenario directory is one `[[example]]`: its `main.rs`, beside the
# `config.toml` that states its chains. Each is self-contained, so the package
# has no library.

[dependencies]
base = { path = "../sdk/base" }
chain-bitcoin = { path = "../sdk/chains/bitcoin" }
chain-ethereum = { path = "../sdk/chains/ethereum" }
chain-solana = { path = "../sdk/chains/solana" }
sdk-config = { path = "../sdk/config", features = ["toml"] }
wallets = { path = "../sdk/wallets", features = ["submissions"] }
indexing = { path = "../sdk/indexing" }
json-rpc = { path = "../packages/json-rpc" }
serde_json.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }

[dev-dependencies]
# The scripted chain `tests/custom_store.rs` asserts the scenario's claims
# over (`indexing::testing`); no scenario uses it.
indexing = { path = "../sdk/indexing", features = ["testing"] }

[[example]]
name = "wallet"
path = "wallet/main.rs"

[[example]]
name = "transfer"
path = "transfer/main.rs"

[[example]]
name = "indexing"
path = "indexing/main.rs"

[[example]]
name = "watch_only"
path = "watch_only/main.rs"

[[example]]
name = "all_chains"
path = "all_chains/main.rs"

[[example]]
name = "custom_store"
path = "custom_store/main.rs"

[lints]
workspace = true
